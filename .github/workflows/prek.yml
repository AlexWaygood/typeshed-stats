# Run prek and let autofix.ci publish its fixes to eligible pull requests.
name: autofix.ci

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - "**.json"
      - "**.md"
      - "**.csv"
      - "**.html"
  pull_request:
    paths-ignore:
      - "**.json"
      - "**.md"
      - "**.csv"
      - "**.html"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  TERM: xterm-256color
  CLICOLOR_FORCE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
      - id: prek
        run: uv run prek run --all-files
      # prek exits nonzero when it edits files. The action checks for a patch.
      # Allow human PRs and Renovate's same-repository ty updates.
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        if: >-
          ${{
            !cancelled() && steps.prek.outcome == 'failure'
            && github.event_name == 'pull_request'
            && (github.event.sender.type == 'User' || github.actor == github.event.pull_request.user.login)
            && (
              github.event.pull_request.user.type == 'User'
              || (
                github.event.pull_request.user.login == 'renovate[bot]'
                && github.event.pull_request.head.repo.full_name == github.repository
                && github.head_ref == 'renovate/ty'
              )
            )
          }}
        with:
          fail-fast: false

  create-issue-on-failure:
    name: Create an issue if daily prek checks failed
    runs-on: ubuntu-latest
    needs: prek
    if: >-
      ${{
        github.repository == 'AlexWaygood/typeshed-stats'
        && always()
        && github.event_name == 'schedule'
        && needs.prek.result == 'failure'
      }}
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.create({
              owner: "AlexWaygood",
              repo: "typeshed-stats",
              title: `Daily prek checks failed on ${new Date().toDateString()}`,
              body: "Run listed here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            })
